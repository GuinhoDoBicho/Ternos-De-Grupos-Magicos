<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERNOS DE GRUPO MÁGICOS DO GUINHO</title>
    <style>
        /* Estilização: Fundo Roxo com Rosa e Simetria */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #4b0082, #ff69b4);
            color: #333;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            background-color: #6a0dad;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
        }

        .input-box {
            border: 2px solid #ff69b4;
            padding: 15px;
            text-align: center;
            border-radius: 15px;
            background: #fff;
        }

        input[type="number"], input[type="password"] {
            width: 80%;
            max-width: 150px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #6a0dad;
            border-radius: 8px;
            padding: 8px;
        }

        /* Estrutura de Botões Simétricos */
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            flex: 1; /* Garante que ambos tenham o mesmo tamanho */
            font-size: 14px;
        }

        .btn-share { background-color: #25d366; color: white; margin-bottom: 5px; flex: none; width: 100%; }
        .btn-check { background-color: #4b0082; color: white; }
        .btn-clear { background-color: #ff1493; color: white; } /* Rosa Choque para o Limpar */

        .grid-ternos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding: 5px;
        }

        .terno-item {
            background: white;
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
        }

        .ganhou {
            background: #ffd700 !important;
            border: 2px solid #ff0000 !important;
            transform: scale(1.05);
        }

        .grupo-tag {
            background: #ff0000;
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        .footer-text {
            text-align: center;
            font-weight: bold;
            color: #ff69b4;
        }

        #password-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #4b0082;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Tela de Segurança -->
    <div id="password-screen">
        <h2>TERNOS DE GRUPO MÁGICOS</h2>
        <p>Digite a senha para acessar:</p>
        <input type="password" id="entry-pass">
        <br><br>
        <button class="btn" style="background:#ff69b4; color:white; flex:none; width:150px;" onclick="validarSenha()">ENTRAR</button>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container" id="main-content" style="display:none;">
        <header>
            <h2 style="margin:0;">TERNOS DE GRUPO MÁGICOS DO GUINHO</h2>
        </header>

        <div class="input-box">
            <label style="display:block; font-weight:bold; margin-bottom: 8px;">ESCOLHA O GRUPO DA CABEÇA:</label>
            <input type="number" id="input-grupo" min="1" max="25" oninput="gerarJogos()">
        </div>

        <button class="btn btn-share" id="btn-share" onclick="compartilhar()" style="display:none;">📲 COMPARTILHAR JOGOS</button>

        <div id="puxada-txt" style="text-align:center; font-weight:bold; color:#4b0082;"></div>

        <div class="grid-ternos" id="grid-ternos"></div>

        <div class="input-box" style="background:#f9f9f9;">
            <h3 style="margin-top:0; color:#6a0dad;">CONFERIDOR</h3>
            <div style="display:flex; justify-content:center; gap:5px; margin-bottom: 15px;">
                <input type="number" class="res" min="1" max="25" style="width:45px; height: 40px;">
                <input type="number" class="res" min="1" max="25" style="width:45px; height: 40px;">
                <input type="number" class="res" min="1" max="25" style="width:45px; height: 40px;">
                <input type="number" class="res" min="1" max="25" style="width:45px; height: 40px;">
                <input type="number" class="res" min="1" max="25" style="width:45px; height: 40px;">
            </div>
            
            <!-- Botões Simétricos -->
            <div class="button-group">
                <button class="btn btn-check" onclick="conferir()">CONFERIR TERNOS</button>
                <button class="btn btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>
            </div>
        </div>

        <div class="footer-text">FEITO POR GUINHO LOTOFACIL</div>
    </div>

    <script>
        // Memória de Acesso
        window.onload = () => {
            if (localStorage.getItem('acesso_liberado') === 'true') liberarSite();
        };

        function validarSenha() {
            if (document.getElementById('entry-pass').value === "TERNOSDEGRUPOSMAGICOS") {
                localStorage.setItem('acesso_liberado', 'true');
                liberarSite();
            } else { alert("Senha Incorreta!"); }
        }

        function liberarSite() {
            document.getElementById('password-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
        }

        // Segurança
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85)) return false; };

        let jogosAtuais = [];
        let puxadaAtual = [];

        function gerarJogos() {
            const n = parseInt(document.getElementById('input-grupo').value);
            if (!n || n < 1 || n > 25) return;

            puxadaAtual = [(n+5)%25||25, (n+10)%25||25, (n+15)%25||25, (n+2)%25||25, (n+7)%25||25, (n+12)%25||25, (n+20)%25||25];
            document.getElementById('puxada-txt').innerText = "PUXADA: " + puxadaAtual.join(" - ");

            jogosAtuais = [];
            for (let i = 0; i < 7; i++) {
                for (let j = i + 1; j < 7; j++) {
                    for (let k = j + 1; k < 7; k++) {
                        jogosAtuais.push([puxadaAtual[i], puxadaAtual[j], puxadaAtual[k]]);
                    }
                }
            }
            renderizarGrid();
            document.getElementById('btn-share').style.display = 'block';
        }

        function renderizarGrid(ganhadores = []) {
            const grid = document.getElementById('grid-ternos');
            grid.innerHTML = "";
            jogosAtuais.forEach((jogo, i) => {
                const ganhou = ganhadores.includes(i);
                grid.innerHTML += `<div class="terno-item ${ganhou ? 'ganhou' : ''}">
                    <strong>#${i+1}</strong><br>
                    <span class="grupo-tag">${jogo[0]}</span>
                    <span class="grupo-tag">${jogo[1]}</span>
                    <span class="grupo-tag">${jogo[2]}</span>
                </div>`;
            });
        }

        function conferir() {
            const res = Array.from(document.querySelectorAll('.res')).map(i => parseInt(i.value)).filter(v => !isNaN(v));
            if (res.length < 5) return alert("Preencha o resultado completo!");

            let premiados = [];
            jogosAtuais.forEach((jogo, i) => {
                if (jogo.filter(g => res.includes(g)).length === 3) premiados.push(i);
            });

            renderizarGrid(premiados);
            if (premiados.length > 0) alert("🔥 PARABÉNS! " + premiados.length + " TERNO(S) PREMIADO(S)!");
        }

        // FUNÇÃO LIMPAR TUDO
        function limparTudo() {
            document.getElementById('input-grupo').value = "";
            document.getElementById('puxada-txt').innerText = "";
            document.getElementById('grid-ternos').innerHTML = "";
            document.querySelectorAll('.res').forEach(input => input.value = "");
            document.getElementById('btn-share').style.display = 'none';
            jogosAtuais = [];
            puxadaAtual = [];
            alert("Campos limpos com sucesso!");
        }

        function compartilhar() {
            let texto = "Ternos De Grupos Magicos Do Guinho. Grupos Escolhidos: (" + puxadaAtual.join(", ") + ")\n\n";
            for (let b = 0; b < 5; b++) {
                texto += "Grupo " + (b + 1) + "\n";
                for (let i = 0; i < 7; i++) {
                    const jogo = jogosAtuais[(b * 7) + i];
                    texto += jogo.join("-") + "\n";
                }
                texto += "\n";
            }
            if (navigator.share) { navigator.share({ title: 'Ternos do Guinho', text: texto }); }
            else { navigator.clipboard.writeText(texto); alert("Copiado!"); }
        }
    </script>
</body>
</html>
